spring.application.name=aes-token-experiment
server.port=8080

# H2 database for the experiment
spring.datasource.url=jdbc:h2:file:./data/aes_tokens
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# H2 console is useful for demonstrating that only encrypted credential
# values and refresh-token hashes are stored.
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# SECURITY: supply these through environment variables.
# APP_AES_KEY must be Base64 for exactly 32 bytes (AES-256).
# APP_JWT_SECRET must be Base64 for at least 32 bytes.
app.aes.key=${APP_AES_KEY}
app.jwt.secret=${APP_JWT_SECRET}
app.jwt.access-token-seconds=900
app.jwt.refresh-token-days=7
